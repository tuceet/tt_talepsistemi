# ==== VARSAYILAN: H2 (hemen calisir, kurulum gerekmez) ====
spring.datasource.url=jdbc:h2:mem:talepdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2

server.port=8080
spring.application.name=tt-talep-destek-sistemi

